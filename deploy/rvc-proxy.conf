# Shared proxy settings for /api and /webhooks.
proxy_http_version 1.1;

# Render (and Fly) route by hostname, so the upstream must be addressed by ITS
# name, not by the name the browser used. $proxy_host is the host from
# proxy_pass, which is exactly that.
proxy_set_header Host              $proxy_host;
proxy_ssl_server_name              on;

# The API rate-limits and audits by client IP. Without these it would see one
# client — this proxy — and throttle the whole organisation as a single user.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# /api/events/stream is Server-Sent Events: one connection held open for as
# long as a dispatcher has the board open. Buffering it would hold every event
# until the buffer filled, which reads as "realtime updates do not work", and
# the default 60s read timeout would drop the connection every minute.
proxy_buffering                    off;
proxy_cache                        off;
proxy_read_timeout                 1h;
proxy_send_timeout                 1h;
