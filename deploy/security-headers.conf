# Security headers for the web app. Included at server level and again inside
# any location that sets its own add_header, because nginx drops inherited
# add_header directives as soon as a location declares one of its own.
#
# CSP: everything the app loads comes from this origin. Pictures may be data:
# or blob: URLs (ID photos, broadcast pictures before upload). Inline styles
# are allowed because React style props and the toast library use them;
# scripts are not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
