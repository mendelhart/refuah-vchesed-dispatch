# =============================================================================
# Refuah V'Chesed Dispatch — Render blueprint
#
# A temporary, no-cost home for looking at the running system. Not production:
# see "What this is not" at the bottom before anyone relies on it.
#
# Three resources, deployed together from this file:
#
#   rvc-db    free Postgres
#   rvc-api   the API and its in-process worker (./Dockerfile)
#   rvc-web   the SPA, served by nginx, which proxies /api and /webhooks to
#             rvc-api so the browser addresses one origin (./Dockerfile.web)
#
# Everything here is either generated by Render or derived from another
# resource in this file. There is no secret to paste in to get this running,
# and nothing in this file is worth keeping out of the repository.
# =============================================================================

databases:
  - name: rvc-db
    plan: free
    databaseName: rvc
    user: rvc
    # 0004_scope_constraints.sql needs btree_gist for the exclusion constraint
    # that stops two duty shifts of the same kind from overlapping. Render
    # allows CREATE EXTENSION for it on 13+, which the migration does itself.
    postgresMajorVersion: '16'

services:
  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  - type: web
    name: rvc-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /health is a real dependency check: it round-trips the database and
    # returns 503 when it cannot reach Postgres, rather than reporting healthy
    # because a port is open.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Render detects the listening port, but saying it removes the guesswork
      # and matches what the image defaults to anyway.
      - key: PORT
        value: '8080'

      - key: DATABASE_URL
        fromDatabase:
          name: rvc-db
          property: connectionString

      # Free Postgres allows 100 connections in total. One API instance with a
      # modest pool leaves room for a psql session and for Render's own checks.
      - key: DATABASE_POOL_MAX
        value: '5'

      - key: SESSION_SECRET
        generateValue: true

      # Licence numbers and licence images are encrypted at rest with this, and
      # the API refuses to start in production without it. Render generates a
      # base64 256-bit value, which is exactly the 32 bytes AES-256-GCM wants.
      #
      # It is generated ONCE and then held by Render. Changing it makes every
      # value already encrypted with the old key unreadable — there is no
      # recovery, so if this deployment ever holds real licence data, that value
      # must be copied somewhere safe before anything else happens to it.
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true

      # Required in production, and true here because Render terminates TLS.
      - key: COOKIE_SECURE
        value: 'true'

      # The browser only ever addresses the web service; nginx there forwards
      # /api and /webhooks. So the public origin, as far as anything user-facing
      # is concerned, is the WEB host — and that is what invitation links, reset
      # links and offer deep links are built from.
      #
      # `sync: false` means Render asks for this value when the blueprint is
      # first synced, instead of storing it here. It is not stored here because
      # it cannot be: this file cannot name the web service's URL without the
      # web service naming the API's in return, and a blueprint whose services
      # reference each other in a circle does not deploy.
      #
      # Enter https://rvc-web.onrender.com, or whatever name Render ends up
      # giving the web service if that one is taken. Getting it wrong is
      # recoverable and not dangerous: it is the host inside links, so a wrong
      # value produces links that point at the wrong host. The first sign-in
      # line in the log prints the path as well as the URL for exactly that
      # reason. Fix it in the rvc-api environment afterwards and redeploy.
      - key: APP_URL
        sync: false

      # API_PUBLIC_URL is deliberately absent. It exists so Twilio webhook
      # signatures are validated against the right URL, and there is no Twilio
      # here. Setting it to something plausible but wrong would be worse than
      # leaving it at its default.

      # The first administrator. There is no default password anywhere in this
      # system; on a host with no shell, this is how the first account exists at
      # all. At boot, on an empty database, it creates one administrator with no
      # password and writes a single-use invitation link to the log — open the
      # rvc-api logs, find "FIRST SIGN-IN LINK", and use it.
      #
      # It is ignored the moment that account has a password, and ignored
      # outright on a system that already has users. See
      # apps/api/src/db/bootstrap-admin.ts.
      #
      # Use the address the first administrator will sign in with.
      #
      # `sync: false` so Render asks for it when the blueprint is first synced,
      # BEFORE anything boots. That ordering matters: the account is created on
      # the first boot, and from then on this setting is ignored — so an address
      # corrected afterwards would be a setting that no longer does anything.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Administrator

      # Nothing is wired to the outside world. With Twilio, WAHA, VAPID and SMTP
      # all absent, the API selects its in-memory providers: every message is
      # recorded as a delivery row and logged, and none is sent. That is the
      # honest state for a preview — a trial deployment that quietly texts real
      # volunteers would be worse than one that sends nothing.
      #
      # Public signup is off for the same reason: this URL is guessable, and an
      # applicant who fills the form here would be applying to nothing.
      - key: PUBLIC_SIGNUP_ENABLED
        value: 'false'

      - key: LOG_LEVEL
        value: info

  # ---------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------
  - type: web
    name: rvc-web
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: '8080'

      # Where nginx forwards /api and /webhooks. Internal to the deployment —
      # the browser never addresses this host.
      - key: API_ORIGIN
        fromService:
          name: rvc-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

# =============================================================================
# What this is not
#
#   * It is not durable. A free Render Postgres is deleted 30 days after it is
#     created. Anything typed into this deployment goes with it.
#   * It is not always on. A free service sleeps after 15 minutes without
#     traffic and takes about a minute to wake, during which the dispatch board
#     is a loading screen. Nothing that has to answer a phone call can live on
#     a host that sleeps.
#   * It sends nothing. No SMS, no WhatsApp, no push, no email — see above.
#   * The worker runs in-process (RUN_WORKER_IN_PROCESS defaults to true), so
#     escalations and reminders only run while the service is awake. On a host
#     that sleeps, an unclaimed trip is NOT escalated on time. This alone rules
#     out the free plan for real dispatch.
#
# docs/DEPLOYMENT.md covers a deployment that does not have these properties.
# =============================================================================
