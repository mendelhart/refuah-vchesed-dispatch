# =============================================================================
# Fly.io — Refuah V'Chesed Dispatch, web app
#
# The SPA. Built from ./Dockerfile.web and served by nginx, which also proxies
# /api and /webhooks to the API so the browser sees one origin. It holds no
# secrets.
#
#   fly deploy --config fly.web.toml
#
# Same region rule as the API: this app serves Quebec residents and there is no
# reason for its edge to sit outside Canada. `yyz` (Toronto) or `yul`.
#
# There are no secrets to set for this app. If you find yourself wanting to add
# one, the value belongs in the API instead — anything shipped to a browser is
# public by definition.
# =============================================================================

app = "rvc-dispatch-web"
primary_region = "yyz"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile.web"

[env]
  # Where nginx forwards /api and /webhooks. The browser never sees this host:
  # it addresses this app only, which is what keeps the session cookie same-site.
  API_ORIGIN = "https://api.dispatch.refuahvchesed.org"

[http_service]
  internal_port = 8080
  force_https = true
  # Static files with no background work: a stopped machine costs nothing and
  # starting one is fast. This is the opposite of the API, which must never
  # stop, because a stopped API runs no worker.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
  cpu_kind = "shared"
