name: CI

# Every push and every pull request. `main` is protected and requires the five
# jobs below to pass before a merge — see docs/DEPLOYMENT.md, "Branch
# protection", for the exact list of required status checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run; `main` is never
# cancelled because deploy.yml keys off its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Nothing here is a secret. These exist because apps/api/src/env.ts validates
  # its configuration at import time, so anything that loads the API — including
  # the migrator and the test suite — needs a valid config to exist at all.
  SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-32
  NODE_ENV: test

jobs:
  # ---------------------------------------------------------------------------
  # install — resolve the dependency tree once and share it with every other
  # job through the cache. Keyed on the lockfile, so an unchanged lockfile means
  # `npm ci` runs zero times for the whole workflow.
  # ---------------------------------------------------------------------------
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - id: key
        run: echo "key=node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/shared/node_modules
            apps/api/node_modules
            apps/web/node_modules
            tools/migrate/node_modules
          key: ${{ steps.key.outputs.key }}

      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --include-workspace-root --workspaces

  # ---------------------------------------------------------------------------
  # typecheck — `tsc --noEmit` in all four workspaces.
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/shared/node_modules
            apps/api/node_modules
            apps/web/node_modules
            tools/migrate/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      # apps/api's tsconfig has a project reference to packages/shared, which
      # must have emitted its declarations before the API can be checked.
      - name: build @rvc/shared
        run: npm run build --workspace=@rvc/shared

      - name: typecheck all workspaces
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # lint — the same command a developer runs locally. Zero warnings allowed.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/shared/node_modules
            apps/api/node_modules
            apps/web/node_modules
            tools/migrate/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: eslint
        run: npx eslint . --max-warnings=0

  # ---------------------------------------------------------------------------
  # api-tests — against a real Postgres 16, with the real migrations applied.
  #
  # A stubbed database would not exercise the parts that carry the correctness
  # of this system: the compare-and-set claim, the partial unique indexes, the
  # CHECK constraints, the append-only audit trigger and next_trip_reference().
  # Those live in SQL, so the tests must run against SQL.
  # ---------------------------------------------------------------------------
  api-tests:
    name: api tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rvc
          POSTGRES_PASSWORD: rvc
          POSTGRES_DB: rvc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rvc -d rvc_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgres://rvc:rvc@127.0.0.1:5432/rvc_test
      DATABASE_POOL_MAX: '5'
      NODE_ENV: test
      LOG_LEVEL: error
      TWILIO_SKIP_SIGNATURE_VALIDATION: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/shared/node_modules
            apps/api/node_modules
            apps/web/node_modules
            tools/migrate/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: build @rvc/shared
        run: npm run build --workspace=@rvc/shared

      # Migrations run first and on their own step, so a broken migration fails
      # with its own error rather than as a confusing wall of test failures.
      - name: apply migrations
        run: npm run db:migrate --workspace=@rvc/api

      - name: verify schema guarantees are present
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            select 1/count(*) from pg_proc where proname = 'next_trip_reference';
            select 1/count(*) from pg_trigger where tgname = 'audit_events_no_update';
            select 1/count(*) from pg_indexes where indexname = 'trip_offers_one_accepted_uq';
            select 1/count(*) from pg_constraint where conname = 'trips_engaged_requires_volunteer_chk';
          "

      # No --passWithNoTests. An empty suite is a failure, not a pass: the whole
      # argument for this rebuild was that the previous system had no tests, and
      # a flag that lets the suite vanish silently would give that back.
      - name: api tests
        run: npm run test --workspace=@rvc/api

      # The Base44 import tooling has its own suite and no database dependency.
      - name: migration tooling tests
        run: npm test --workspace=@rvc/migrate

  # ---------------------------------------------------------------------------
  # browser-tests — the claims no API test can check.
  #
  # Runs the real build against the real API: that every screen opens for the
  # role meant to reach it, that a dispatcher can complete an intake at phone
  # width, that the manifest is installable, and — with the network genuinely
  # switched off — that a job card is still readable. "Do not claim offline
  # functionality unless it actually works" is a testable claim, so it is tested.
  # ---------------------------------------------------------------------------
  browser-tests:
    name: browser tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rvc
          POSTGRES_PASSWORD: rvc
          POSTGRES_DB: rvc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rvc -d rvc_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgres://rvc:rvc@127.0.0.1:5432/rvc_e2e
      NODE_ENV: development
      LOG_LEVEL: warn
      COOKIE_SECURE: 'false'
      APP_URL: http://127.0.0.1:4173
      API_PUBLIC_URL: http://127.0.0.1:8080
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-32
      FIELD_ENCRYPTION_KEY: Y2ktb25seS1rZXktbm90LXVzZWQtYW55d2hlcmUhISE=

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/shared/node_modules
            apps/api/node_modules
            apps/web/node_modules
            tools/migrate/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: install the browser
        run: npx playwright install --with-deps chromium

      - name: run the browser suite
        run: ./scripts/e2e.sh

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # build — shared -> api -> web, plus the production container image.
  #
  # Building the image in CI is what stops "works on my machine, fails on
  # deploy": the release_command and the entrypoint both come out of it.
  # ---------------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [install, typecheck, lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/shared/node_modules
            apps/api/node_modules
            apps/web/node_modules
            tools/migrate/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: build workspaces (shared -> api -> web)
        run: npm run build

      - name: assert the API actually emitted its entrypoints
        run: |
          test -f apps/api/dist/index.js
          test -f apps/api/dist/db/migrate.js
          test -f apps/api/dist/jobs/worker.js

      - uses: docker/setup-buildx-action@v3

      - name: build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: rvc-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: web
          push: false
          tags: rvc-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must at minimum be able to start and fail for the right
      # reason: no DATABASE_URL means env.ts rejects the config at boot.
      - name: smoke-test the image's config validation
        run: |
          set +e
          out="$(docker run --rm -e SESSION_SECRET=short rvc-api:${{ github.sha }} 2>&1)"
          echo "$out"
          echo "$out" | grep -q "Invalid environment configuration" || {
            echo "::error::image did not reject an invalid configuration at boot"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # A single job that is green only when everything else is. Branch protection
  # can require just this one, so adding a job later does not mean editing the
  # protection rule.
  # ---------------------------------------------------------------------------
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [typecheck, lint, api-tests, browser-tests, build]
    if: always()
    steps:
      - name: fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi
          echo "all CI jobs succeeded"
