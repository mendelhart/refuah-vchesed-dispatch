# =============================================================================
# Fly.io — Refuah V'Chesed Dispatch API
#
# primary_region = "yyz" (Toronto). This is a requirement, not a preference:
# the database holds Quebec residents' names, phone numbers, home addresses and
# passenger notes about medical trips. Under Quebec's Law 25 that data stays in
# Canada unless a privacy impact assessment says otherwise. Do not add regions
# outside Canada, and do not let Fly autoscale into one. `yul` (Montreal) is the
# only other acceptable region.
#
# This app is the API + background worker. The SPA is a SECOND Fly app
# (rvc-dispatch-web) built from `--target web` in the Dockerfile. See
# docs/DEPLOYMENT.md.
#
# -----------------------------------------------------------------------------
# SECRETS — set with `fly secrets set` before the first deploy.
# Never in this file, never in the repo, never as [env].
#
#   REQUIRED
#     fly secrets set SESSION_SECRET="$(openssl rand -base64 48)"
#       Signs and validates session cookies. ≥32 chars or the process refuses
#       to boot. Rotating it logs everyone out; that is the intended blast
#       radius, so rotate on any suspected compromise.
#
#     DATABASE_URL is set for you by `fly postgres attach`. If you manage
#     Postgres yourself, set it explicitly and include ?sslmode=require.
#
#   REQUIRED FOR SMS, VOICE AND SMS-BASED TRIP ACCEPTANCE
#     fly secrets set TWILIO_ACCOUNT_SID=ACxxxxxxxx \
#                     TWILIO_AUTH_TOKEN=xxxxxxxx \
#                     TWILIO_PHONE_NUMBER=+15145550000
#       Without all three, providers/index.ts selects the in-memory SMS and
#       calling providers in development, and in production leaves the Twilio
#       provider selected but disabled — every SMS delivery then fails and is
#       recorded as failed in notification_deliveries. TWILIO_AUTH_TOKEN is also
#       what validates inbound webhook signatures; it is not optional in prod.
#
#   REQUIRED FOR WEB PUSH
#     npx web-push generate-vapid-keys
#     fly secrets set VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... \
#                     VAPID_SUBJECT=mailto:admin@refuahvchesed.org
#       Absent, the API logs "[config] VAPID keys absent — push notifications
#       are disabled" at boot and every push delivery is recorded as skipped.
#       Changing the key pair invalidates every existing browser subscription.
#
#   OPTIONAL
#     fly secrets set SENTRY_DSN=https://...
#       Validated by env.ts but NOT yet read by any code — setting it today
#       does nothing. See docs/DEPLOYMENT.md, "Known gaps".
#
# Verify with `fly secrets list` (names and digests only, never values).
# =============================================================================

app = "rvc-dispatch-api"
primary_region = "yyz"
kill_signal = "SIGTERM"
# index.ts allows itself 15s to close the server, drain the worker and end the
# pool; give it a little more than that before Fly pulls the plug.
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"
  # The default (final) stage is the API. The SPA image is built separately
  # with `fly deploy --config fly.web.toml --build-target web`.

# -----------------------------------------------------------------------------
# Non-secret configuration. Anything here is visible in `fly config show`.
# -----------------------------------------------------------------------------
[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"

  APP_URL = "https://dispatch.refuahvchesed.org"
  API_PUBLIC_URL = "https://api.dispatch.refuahvchesed.org"

  # Non-negotiable in production; env.ts throws at boot if either is wrong.
  COOKIE_SECURE = "true"
  TWILIO_SKIP_SIGNATURE_VALIDATION = "false"

  SESSION_COOKIE_NAME = "rvc_session"

  # 10 connections per machine. Two machines = 20, which fits comfortably under
  # a small Fly Postgres instance's 100-connection ceiling with headroom for
  # the release_command, psql sessions and the backup job. Raise both together.
  DATABASE_POOL_MAX = "10"

  # The worker runs inside the API process. At this volume (a few hundred trips
  # and a few thousand notification deliveries a day) that is correct; see
  # docs/DEPLOYMENT.md for the signals that justify splitting it out.
  RUN_WORKER_IN_PROCESS = "true"
  WORKER_POLL_MS = "2000"
  WORKER_CONCURRENCY = "4"

  GEOCODER_BASE_URL = "https://nominatim.openstreetmap.org"
  GEOCODER_USER_AGENT = "RefuahVChesedDispatch/1.0 (ops@refuahvchesed.org)"
  GEOCODER_BIAS = "Montreal, QC, Canada"
  VAPID_SUBJECT = "mailto:admin@refuahvchesed.org"

# -----------------------------------------------------------------------------
# Migrations run once per deploy, before any new machine takes traffic. If this
# exits non-zero the release is aborted and the old version keeps serving.
# -----------------------------------------------------------------------------
[deploy]
  release_command = "node dist/db/migrate.js"
  strategy = "rolling"

# -----------------------------------------------------------------------------
# HTTP
# -----------------------------------------------------------------------------
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # a stopped machine runs no worker: offers would
                               # never expire and nothing would escalate.
  auto_start_machines = true
  # Two always-on machines. ~500 volunteers is a low-concurrency workload —
  # the load is bursty around each broadcast, not sustained — so this is about
  # surviving a machine loss and a rolling deploy, not about throughput.
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    # Fastify handles far more than this; the real ceiling is DATABASE_POOL_MAX
    # and the SSE streams (one long-lived connection per open dispatcher board).
    soft_limit = 200
    hard_limit = 250

  # Liveness: /health does `select 1`, so a machine with a broken database
  # connection is taken out of rotation instead of serving 500s.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# -----------------------------------------------------------------------------
# Machines. Start here and measure before changing.
#   shared-cpu-1x / 512MB is enough for Fastify + a 10-connection pool + the
#   worker. Watch RSS after a broadcast to 200 volunteers: the offer loop is
#   one INSERT and one enqueue per recipient inside a single transaction.
# -----------------------------------------------------------------------------
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"

# -----------------------------------------------------------------------------
# Scaling notes for ~500 volunteers
#
#   * Steady state is tiny. The peak is the moment a dispatcher broadcasts:
#     N offer rows, N notifications, 2N+ delivery rows and N jobs in one
#     transaction, then the worker sends N SMS through Twilio.
#   * Scale UP (memory, then machines) when: p95 on POST /api/trips/:id/offer
#     exceeds ~2s, or `select count(*) from jobs where status='pending' and
#     run_at < now() - interval '5 minutes'` is persistently non-zero.
#   * Scale the DATABASE before scaling machines. Adding machines multiplies
#     DATABASE_POOL_MAX; adding connections to an undersized Postgres makes
#     things worse, not better.
#   * SSE: every open dispatcher board holds a connection for as long as the tab
#     is open. Budget one slot per dispatcher browser tab, not per volunteer —
#     volunteers use the app transactionally.
#   * Do NOT enable auto_stop_machines and do NOT scale to zero. See above.
#   * Multiple machines are safe: the job queue claims with FOR UPDATE SKIP
#     LOCKED, and both machines hold their own LISTEN connection.
